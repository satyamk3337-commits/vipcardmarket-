    // PhonePe Authentic QR Code Component
    function PhonePeQR({ upiId = DEFAULT_UPI_ID, amount = 0, qrImage = DEFAULT_PAYMENT_QR }) {
      const [qrUrl, setQrUrl] = useState('');
      const [copied, setCopied] = useState(false);

      useEffect(() => {
        let uri = `upi://pay?pa=${encodeURIComponent(upiId)}&pn=VIP%20CARD%20MARKET&cu=INR`;
        if (amount > 0) uri += `&am=${amount}`;

        if (window.QRCode) {
          window.QRCode.toDataURL(uri, {
            width: 440,
            margin: 1,
            color: { dark: '#000000', light: '#ffffff' },
            errorCorrectionLevel: 'H'
          }).then(url => setQrUrl(url)).catch(err => console.error(err));

                            <div className="text-emerald-400 font-bold mb-1">✓ DEMO VAULT ACTIVE</div>
                            <div>Card: <span className="text-white font-bold">{o.card_details.number}</span></div>
                            <div>CVV: <span className="text-purple-300">{o.card_details.cvv}</span> • Expiry: {o.card_details.expiry}</div>
                          </div>
                        ) : (
                          <div className="p-3 rounded-xl bg-amber-950/30 border border-amber-500/30 text-xs font-mono text-amber-300">
                            ⏳ Awaiting Admin Verification for UTR: {o.utr}
                          </div>
                        )}
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {/* Admin Console View */}
            {view === 'admin' && (
              <div>
                <div className="flex items-center justify-between pb-4 border-b border-purple-500/20 mb-6">
                  <div>
                    <div className="flex items-center gap-2">
                      <h2 className="text-2xl font-bold font-heading text-white">ADMIN CONSOLE</h2>
                      <span className="px-2 py-0.5 rounded text-[10px] font-mono bg-emerald-950 text-emerald-400 border border-emerald-500/30">
                        PASSWORD: RAJAJI
                      </span>
                    </div>
                    <p className="text-xs text-slate-400">Full control: cards, prices, demo balances, card display details, QR/payment settings, users, orders and customer support.</p>
                  </div>
                  <div className="flex gap-2">
                    <button
                      onClick={() => {
                        setIsAdminUnlocked(false);
                        setView('home');
                        alert('Admin Console locked.');
                      }}
                      className="px-3 py-1.5 rounded-xl bg-rose-950 text-rose-300 border border-rose-500/30 text-xs font-mono"
                    >
                      Lock Console
                    </button>
                    <button onClick={() => setView('home')} className="px-3 py-1.5 rounded-xl bg-purple-600 text-white text-xs font-mono font-bold">
                      Storefront
                    </button>
                  </div>
                </div>

                {/* Admin Tabs — full local admin controls */}
                <div className="flex gap-2 mb-4 overflow-x-auto pb-1">
                  <button onClick={() => setAdminTab('orders')} className={`px-4 py-2 rounded-xl text-xs font-mono font-bold whitespace-nowrap ${adminTab === 'orders' ? 'bg-purple-600 text-white' : 'bg-slate-900 text-slate-400'}`}>ORDERS / UTR</button>
                  <button onClick={() => setAdminTab('products')} className={`px-4 py-2 rounded-xl text-xs font-mono font-bold whitespace-nowrap ${adminTab === 'products' ? 'bg-purple-600 text-white' : 'bg-slate-900 text-slate-400'}`}>PRODUCTS</button>
                  <button onClick={() => setAdminTab('users')} className={`px-4 py-2 rounded-xl text-xs font-mono font-bold whitespace-nowrap ${adminTab === 'users' ? 'bg-purple-600 text-white' : 'bg-slate-900 text-slate-400'}`}>USERS</button>
                  <button onClick={() => setAdminTab('support')} className={`px-4 py-2 rounded-xl text-xs font-mono font-bold whitespace-nowrap ${adminTab === 'support' ? 'bg-purple-600 text-white' : 'bg-slate-900 text-slate-400'}`}>CUSTOMER SUPPORT ({supportMessages.filter(m => m.status === 'OPEN').length})</button>
                  <button onClick={() => setAdminTab('settings')} className={`px-4 py-2 rounded-xl text-xs font-mono font-bold whitespace-nowrap ${adminTab === 'settings' ? 'bg-purple-600 text-white' : 'bg-slate-900 text-slate-400'}`}>PAYMENT / QR</button>
                </div>

                {adminTab === 'orders' && (
                  <div className="rounded-2xl glass-panel p-5">
                    <h3 className="text-base font-bold text-white mb-3">Pending Payment Verifications</h3>
                    <div className="space-y-3">
                      {orders.map(o => (
                        <div key={o.id} className="p-4 rounded-xl bg-slate-950/80 border border-slate-800 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 text-xs font-mono">
                          <div>
                            <div className="text-white font-bold">{o.order_number} - {o.product_name}</div>
                            <div className="text-slate-400">Price: ₹{o.final_amount} • Submitted UTR: <span className="text-purple-300 font-bold">{o.utr}</span></div>
                            <div className="text-[10px] text-slate-500">Status: {o.status}</div>
                          </div>

                          <div className="flex gap-2 items-center">
                            {o.status !== 'COMPLETED' ? (
                              <button
                                onClick={() => verifyOrder(o.id)}
                                className="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold"
                              >
                                Verify & Issue Card
                              </button>
                            ) : (
                              <span className="text-emerald-400 font-bold">✓ Verified</span>
                            )}
                            <button onClick={() => deleteOrder(o.id)} className="px-3 py-2 rounded-xl bg-rose-950 text-rose-300 border border-rose-500/20 font-bold">DELETE</button>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {adminTab === 'products' && (
                  <div className="rounded-2xl glass-panel p-5 space-y-4 vip-glow">
                    <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                      <div>
                        <h3 className="text-base font-bold text-white">Card / Product Control</h3>
                        <p className="text-[10px] text-slate-500 font-mono">Edit every display/card field, add cards, or remove cards. Data is stored in this browser.</p>
                      </div>
                      <button onClick={addProduct} className="px-4 py-2 rounded-xl bg-gradient-to-r from-purple-600 to-indigo-600 text-white text-xs font-mono font-bold vip-shine">+ ADD CARD</button>
                    </div>

                    {products.map(p => (
                      <div key={p.id} className="p-4 rounded-2xl bg-slate-950/70 border border-purple-500/15 space-y-3 vip-card-hover">
                        <div className="flex items-center justify-between gap-2">
                          <div className="font-bold text-purple-200">{p.name}</div>
                          <button onClick={() => deleteProduct(p.id)} className="px-3 py-1.5 rounded-lg bg-rose-950 text-rose-300 border border-rose-500/30 text-[10px] font-mono font-bold">DELETE CARD</button>
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-2">
                          <input value={p.name || ''} onChange={e => updateProductField(p.id,'name',e.target.value)} className="px-3 py-2 rounded-lg bg-slate-900 border border-slate-700 text-xs text-white" placeholder="Card name" />
                          <input type="number" value={p.price ?? 0} onChange={e => updateProductField(p.id,'price',e.target.value)} className="px-3 py-2 rounded-lg bg-slate-900 border border-slate-700 text-xs text-white" placeholder="Price" />
                          <input type="number" value={p.demo_balance ?? 0} onChange={e => updateProductField(p.id,'demo_balance',e.target.value)} className="px-3 py-2 rounded-lg bg-slate-900 border border-slate-700 text-xs text-white" placeholder="Demo balance" />
                          <input type="number" value={p.demo_limit ?? 0} onChange={e => updateProductField(p.id,'demo_limit',e.target.value)} className="px-3 py-2 rounded-lg bg-slate-900 border border-slate-700 text-xs text-white" placeholder="Demo limit" />
                          <input value={p.cardNumber || ''} onChange={e => updateProductField(p.id,'cardNumber',e.target.value)} className="px-3 py-2 rounded-lg bg-slate-900 border border-slate-700 text-xs font-mono text-white" placeholder="Demo card number" />
                          <input value={p.cardholder || ''} onChange={e => updateProductField(p.id,'cardholder',e.target.value)} className="px-3 py-2 rounded-lg bg-slate-900 border border-slate-700 text-xs text-white" placeholder="Cardholder" />
                          <input value={p.expiry || ''} onChange={e => updateProductField(p.id,'expiry',e.target.value)} className="px-3 py-2 rounded-lg bg-slate-900 border border-slate-700 text-xs font-mono text-white" placeholder="Expiry e.g. 12/30" /><input value={p.cvv || ''} onChange={e => updateProductField(p.id,'cvv',e.target.value.replace(/\D/g,'').slice(0,3))} className="px-3 py-2 rounded-lg bg-slate-900 border border-slate-700 text-xs font-mono text-white" placeholder="Demo CVV" />
                          <select value={p.network || 'VISA'} onChange={e => updateProductField(p.id,'network',e.target.value)} className="px-3 py-2 rounded-lg bg-slate-900 border border-slate-700 text-xs text-white">
                            <option>VISA</option><option>MASTERCARD</option><option>RUPAY</option>
                          </select>
                          <select value={p.tier || 'STANDARD'} onChange={e => updateProductField(p.id,'tier',e.target.value)} className="px-3 py-2 rounded-lg bg-slate-900 border border-slate-700 text-xs text-white">
                            <option>STANDARD</option><option>PREMIUM</option><option>VIP</option><option>ELITE</option><option>PLATINUM</option><option>ULTRA</option><option>ROYAL</option>
                          </select>
                        </div>

                        <textarea value={p.description || ''} onChange={e => updateProductField(p.id,'description',e.target.value)} rows="2" className="w-full px-3 py-2 rounded-lg bg-slate-900 border border-slate-700 text-xs text-white" placeholder="Card description shown to users" />
                        <div className="text-[10px] text-slate-500 font-mono">Changes are reflected in the storefront immediately on this browser.</div>
                      </div>
                    ))}
                    {products.length === 0 && <div className="text-slate-500 text-xs">No cards. Tap + ADD CARD.</div>}
                  </div>
                )}

                {adminTab === 'users' && (
                  <div className="rounded-2xl glass-panel p-5">
                    <h3 className="text-base font-bold text-white mb-3">Users / Customers</h3>
                    <div className="space-y-2">
                      {Array.from(new Set(orders.map(o => o.user_name || 'Customer'))).map(name => (
                        <div key={name} className="p-3 rounded-xl bg-slate-950/70 border border-slate-800 flex justify-between text-xs">
                          <span className="text-white font-bold">{name}</span>
                          <span className="text-slate-400">{orders.filter(o => (o.user_name || 'Customer') === name).length} order(s)</span>
                        </div>
                      ))}
                      {orders.length === 0 && <div className="text-slate-500 text-xs">No users/orders recorded yet.</div>}
                    </div>
                  </div>
                )}

                {adminTab === 'support' && (
                  <div className="rounded-2xl glass-panel p-5">
                    <h3 className="text-base font-bold text-white mb-3">Customer Support Inbox</h3>
                    {supportMessages.length === 0 ? (
                      <div className="text-slate-500 text-xs">No support messages yet.</div>
                    ) : (
                      <div className="space-y-3">
                        {supportMessages.map(m => (
                          <div key={m.id} className="p-4 rounded-xl bg-slate-950/80 border border-slate-800">
                            <div className="flex justify-between gap-2 text-xs">
                              <span className="text-cyan-300 font-bold">{m.user}</span>
                              <span className="text-slate-500">{m.created_at}</span>
                            </div>
                            <div className="text-slate-200 text-sm mt-2">{m.message}</div>
                            {m.reply && <div className="mt-2 p-2 rounded-lg bg-emerald-950/30 text-emerald-300 text-xs"><b>Admin reply:</b> {m.reply}</div>}
                            <div className="flex gap-2 mt-3">
                              <input id={'reply-' + m.id} defaultValue={m.reply} placeholder="Type admin reply..." className="flex-1 px-3 py-2 rounded-lg bg-slate-900 border border-slate-700 text-xs text-white" />
                              <button onClick={() => replySupport(m.id, document.getElementById('reply-' + m.id)?.value || '')} className="px-3 py-2 rounded-lg bg-emerald-600 text-white text-xs font-bold">REPLY</button>
                              <button onClick={() => setSupportMessages(prev => prev.filter(x => x.id !== m.id))} className="px-3 py-2 rounded-lg bg-rose-950 text-rose-300 text-xs font-bold">DELETE</button>
                            </div>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                )}

                {adminTab === 'settings' && (
                  <div className="rounded-2xl glass-panel p-5 space-y-4 max-w-xl">
                    <h3 className="text-base font-bold text-white">Payment & UPI Settings</h3>
                    <div>
                      <label className="block text-xs font-mono text-slate-400 mb-1">Active UPI ID</label>
                      <input
                        type="text"
                        value={activeUpiId}
                        onChange={e => setActiveUpiId(e.target.value)}
                        className="w-full px-3 py-2 rounded-xl bg-slate-900 border border-slate-700 text-xs font-mono text-white"
                      />
                    </div>
                    <div className="pt-2 space-y-3">
                      <div className="text-[10px] text-slate-500 font-mono">
                        Change the payment QR below. It is used immediately on BUY → Checkout. Cross-device/all-user updates require a shared backend database.
                      </div>
                      <label className="block text-xs font-mono text-slate-400 font-bold">CHANGE PAYMENT QR</label>
                      <input type="file" accept="image/*" onChange={handleQrUpload} className="w-full text-xs text-slate-300 file:mr-3 file:px-3 file:py-2 file:rounded-lg file:border-0 file:bg-purple-600 file:text-white" />
                      <button onClick={() => { setPaymentQr(DEFAULT_PAYMENT_QR); alert('QR reset to the default QR.'); }} className="px-3 py-2 rounded-xl bg-slate-900 border border-slate-700 text-xs text-slate-300">RESET DEFAULT QR</button>
                      <label className="block text-xs font-mono text-slate-400 font-bold">LIVE QR PREVIEW</label>
                      <PhonePeQR upiId={activeUpiId} qrImage={paymentQr} />
                    </div>
                  </div>
                )}
              </div>
            )}
          </main>

          {/* Customer Support Modal */}
          {supportModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 backdrop-blur-md">
              <div className="w-full max-w-lg rounded-3xl glass-panel p-6 bg-[#0b0c1e] text-white shadow-2xl max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between items-center pb-3 border-b border-cyan-500/20 mb-4">
                  <div>
                    <h3 className="text-base font-bold font-heading">CUSTOMER SUPPORT</h3>
                    <p className="text-[10px] text-slate-400 font-mono">Send a message to the admin support inbox.</p>
                  </div>
                  <button onClick={() => setSupportModalOpen(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>
                <div className="space-y-3">
                  <input
                    value={supportUserName}
                    onChange={e => { setSupportUserName(e.target.value); localStorage.setItem('vip_support_user', e.target.value); }}
                    placeholder="Your name"
                    className="w-full px-3 py-2 rounded-xl bg-slate-900 border border-slate-700 text-xs text-white"
                  />
                  <textarea
                    value={supportText}
                    onChange={e => setSupportText(e.target.value)}
                    placeholder="Type your message..."
                    rows="4"
                    className="w-full px-3 py-2 rounded-xl bg-slate-900 border border-slate-700 text-xs text-white"
                  />
                  <button onClick={sendSupportMessage} className="w-full py-3 rounded-xl bg-cyan-600 hover:bg-cyan-500 text-white font-mono font-bold text-xs">
                    SEND TO ADMIN
                  </button>
                </div>
                <div className="mt-5 space-y-2">
                  {supportMessages.filter(m => m.user === supportUserName).map(m => (
                    <div key={m.id} className="p-3 rounded-xl bg-slate-950/70 border border-slate-800 text-xs">
                      <div className="text-cyan-300 font-bold">You • {m.status}</div>
                      <div className="text-slate-200 mt-1">{m.message}</div>
                      {m.reply && <div className="mt-2 p-2 rounded-lg bg-emerald-950/30 text-emerald-300"><b>Admin:</b> {m.reply}</div>}
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* Checkout & PhonePe UPI Modal */}
          {checkoutOpen && selectedProduct && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-3 bg-black/90 backdrop-blur-md">
              <div className="w-full max-w-lg rounded-[28px] glass-panel p-5 bg-[#080a18] text-white shadow-2xl max-h-[94vh] overflow-y-auto border border-purple-500/30 vip-glow">
                <div className="flex justify-between items-center pb-3 border-b border-purple-500/20 mb-4">
                  <div>
                    <h3 className="text-lg font-bold font-heading">Scan & Pay</h3>
                    {selectedProduct.price > 0 && (
                      <div className={`mt-2 inline-flex items-center gap-2 px-3 py-1 rounded-full border text-xs font-mono font-bold ${qrSeconds > 0 ? 'bg-rose-950/50 border-rose-500/30 text-rose-300' : 'bg-slate-900 border-slate-700 text-slate-400'}`}>
                        <span>◷</span> QR Expires in: {String(Math.floor(qrSeconds/60)).padStart(2,'0')}:{String(qrSeconds%60).padStart(2,'0')}
                      </div>
                    )}
                  </div>
                  <button onClick={() => setCheckoutOpen(false)} className="w-9 h-9 rounded-full bg-slate-900 border border-slate-700 text-slate-400 hover:text-white">✕</button>
                </div>

                <div className="text-center mb-4">
                  <div className="text-4xl font-black font-heading text-purple-400">₹{selectedProduct.price === 0 ? 0 : Math.max(0, selectedProduct.price - discount)}</div>
                  <div className="text-xs text-slate-400 mt-1">{selectedProduct.name}</div>
                </div>

                {selectedProduct.price > 0 && (
                  <div className="p-3 rounded-2xl bg-slate-900/70 border border-purple-500/20 mb-4">
                    <div className="text-xs font-bold text-purple-200 mb-2">🎟 Apply Coupon Code</div>
                    <div className="flex gap-2">
                      <input type="text" placeholder="ENTER COUPON CODE..." value={couponCode} onChange={e => setCouponCode(e.target.value)} className="flex-1 px-3 py-3 rounded-xl bg-[#070914] border border-purple-500/30 text-xs font-mono uppercase text-white" />
                      <button onClick={handleApplyCoupon} className="px-5 rounded-xl bg-gradient-to-r from-purple-600 to-fuchsia-600 text-white text-xs font-bold vip-shine">APPLY</button>
                    </div>
                    {discount > 0 && <div className="text-[10px] text-emerald-400 font-mono mt-2">Discount: -₹{discount}</div>}
                  </div>
                )}

                {selectedProduct.price > 0 ? (
                  <>
                    <div className="flex justify-center my-4">
                      <div className="p-3 rounded-2xl bg-white border border-purple-300/50 shadow-[0_0_35px_rgba(168,85,247,.35)] vip-card-hover">
                        <img src={paymentQr} alt="Payment QR" className="w-56 h-56 sm:w-64 sm:h-64 object-contain rounded-xl" />
                      </div>
                    </div>

                    <div className="flex justify-center gap-2 mb-3 text-[10px] font-bold">
                      <span className="px-3 py-2 rounded-full bg-purple-900/50 border border-purple-500/30">पे PhonePe</span>
                      <span className="px-3 py-2 rounded-full bg-slate-900 border border-slate-700">G GPay</span>
                      <span className="px-3 py-2 rounded-full bg-slate-900 border border-slate-700">P Paytm</span>
                    </div>

                    <div className="px-4 py-3 rounded-xl bg-slate-950 border border-purple-500/20 text-center font-mono text-xs">
                      <span className="text-purple-300">UPI ID:</span> <span className="text-white font-bold">{activeUpiId}</span>
                    </div>

                    <div className="mt-4 p-3 rounded-2xl bg-slate-900/60 border border-emerald-500/20">
                      <label className="block text-xs font-bold text-emerald-300 mb-2">▣ Enter 12-Digit UTR / Transaction ID</label>
                      <input type="text" required placeholder="e.g. 432156789012" value={utrInput} onChange={e => setUtrInput(e.target.value.replace(/\D/g,'').slice(0,12))} maxLength="12" className="w-full px-4 py-3 rounded-xl bg-[#070914] border border-emerald-500/30 text-sm font-mono text-white" />
                    </div>
                  </>
                ) : (
                  <div className="p-4 rounded-2xl bg-purple-950/20 border border-purple-500/20 text-center">
                    <div className="text-white font-bold">{selectedProduct.name}</div>
                    <div className="text-xs text-purple-300 mt-1">Free fictional demo card claim</div>
                  </div>
                )}

                <button onClick={handlePlaceOrder} className="w-full mt-5 py-4 rounded-2xl bg-gradient-to-r from-emerald-500 to-green-500 text-white font-mono font-bold text-sm shadow-[0_0_30px_rgba(16,185,129,.28)] vip-shine">
                  {selectedProduct.price === 0 ? 'CLAIM FREE DEMO CARD' : '➤ SUBMIT UTR & PLACE ORDER'}
                </button>
              </div>
            </div>
          )}

          {/* Product Detail Modal */}
          {detailOpen && selectedProduct && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 backdrop-blur-md">
              <div className="w-full max-w-md rounded-3xl glass-panel p-6 bg-[#0b0c1e] text-white shadow-2xl">
                <div className="flex justify-between items-center pb-3 border-b border-purple-500/20 mb-4">
                  <h3 className="text-base font-bold font-heading">{selectedProduct.name}</h3>
                  <button onClick={() => setDetailOpen(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>
                <div className="flex justify-center mb-4">
                  <CardMockup product={selectedProduct} />
                </div>
                <p className="text-xs text-slate-300 leading-relaxed mb-4">{selectedProduct.description}</p>
                <div className="space-y-1 mb-6 text-xs text-slate-400">
                  {selectedProduct.features.map((f, i) => (
                    <div key={i}>✓ {f}</div>
                  ))}
                </div>
                <button
                  onClick={() => {
                    setDetailOpen(false);
                    handleBuyNow(selectedProduct);
                  }}
                  className="w-full py-3 rounded-xl bg-purple-600 text-white font-mono font-bold text-xs"
                >
                  BUY NOW
                </button>
              </div>
            </div>
          )}

          {/* Admin Password Security Modal */}
          {adminModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 backdrop-blur-md">
              <div className="w-full max-w-sm rounded-3xl glass-panel p-6 bg-[#0b0c1e] text-white shadow-2xl text-center">
                <div className="w-12 h-12 rounded-2xl bg-indigo-600/20 border border-indigo-500/30 flex items-center justify-center text-indigo-400 mx-auto mb-3 text-xl">
                  🔒
                </div>
                <h3 className="text-base font-bold font-heading">Admin Password Required</h3>
                <p className="text-xs text-slate-400 mt-1 mb-4">Enter master security password to access admin console.</p>

                <form onSubmit={handleAdminAuth} className="space-y-3">
                  <input
                    type="password"
                    autoFocus
                    placeholder="Enter password..."
                    value={adminPasswordInput}
                    onChange={e => {
                      setAdminPasswordInput(e.target.value);
                      setAdminError(false);
                    }}
                    className={`w-full px-3 py-2 rounded-xl bg-slate-900 border text-xs font-mono text-center text-white ${
                      adminError ? 'border-rose-500' : 'border-slate-700'
                    }`}
                  />
                  {adminError && <div className="text-rose-400 text-xs font-mono">Incorrect password. Access denied.</div>}

                  <button type="submit" className="w-full py-2.5 rounded-xl bg-indigo-600 text-white font-mono font-bold text-xs">
                    UNLOCK CONSOLE
                  </button>
                  <button type="button" onClick={() => setAdminModalOpen(false)} className="text-xs text-slate-400 hover:text-white font-mono block mx-auto">
                    Cancel
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="border-t border-purple-500/20 bg-[#06060c] py-6 px-4 text-center text-xs text-slate-500 font-mono">
            <div>© VIP CARD MARKET • Premium Digital Card Marketplace</div>
            <div className="text-purple-400/80 mt-1">Admin Console • Payment QR controlled by Admin • Customer Support enabled</div>
          </footer>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
